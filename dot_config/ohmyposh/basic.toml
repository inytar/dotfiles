#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 3
final_space = true
async = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    background = 'transparent'
    foreground = 'blue'
    template = '{{ .Path }}/'

    [blocks.segments.properties]
      style = 'powerlevel'
      max_width = 30
      full_length_dirs = 2

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foreground = 'green'
    background = 'transparent'
    template = ' <cyan>⠀{{ .Dir | base }}</> {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>'

    [blocks.segments.properties]
      fetch_status = true

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = 'yellow'
    background = 'transparent'
    template = '{{ .FormattedMs }}'

    [blocks.segments.properties]
      threshold = 5000

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
      "{{if gt .Code 0}}red{{end}}",
      "{{if eq .Code 0}}magenta{{end}}",
    ]
    background = 'transparent'
    template = '{{ if glob "/run/.toolboxenv" }}⬢{{ else }}❯{{ end }}'

[transient_prompt]
  foreground_templates = [
    "{{if gt .Code 0}}red{{end}}",
    "{{if eq .Code 0}}magenta{{end}}",
  ]
  background = 'transparent'
  template = '{{ if glob "/run/.toolboxenv" }}⬢{{ else }}❯{{ end }} '

[secondary_prompt]
  foreground = 'magenta'
  background = 'transparent'
  template = '-{{ if glob "/run/.toolboxenv" }}⬢{{ else }}❯{{ end }} '
